name: Private cloud Vita build

on:
  workflow_dispatch:
  push:
    branches:
      - optimization/baseline-profiling
    paths:
      - ".github/workflows/cloud-vita-build.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: temporary-vita-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: optimization/baseline-profiling

      - name: Remove previously exposed public VPK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          artifacts_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/actions/artifacts?name=STSVITA-temporary-build&per_page=100")"
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api/actions/artifacts/$artifact_id"
            echo "Deleted public VPK artifact $artifact_id"
          done < <(jq -r '.artifacts[]?.id' <<< "$artifacts_json")

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make cmake python3 python3-pip imagemagick ffmpeg unzip zip wget ca-certificates curl jq pkg-config libjpeg-dev libpng-dev libtiff-dev libwebp-dev libfreetype6-dev
          if ! command -v magick >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec /usr/bin/convert "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null
            sudo chmod +x /usr/local/bin/magick
          fi
          python3 --version
          java -version
          gradle --version
          magick -version
          ffmpeg -version

      - name: Install VitaSDK
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/vitasdk/vdpm.git "$RUNNER_TEMP/vdpm"
          cd "$RUNNER_TEMP/vdpm"
          export VITASDK="$RUNNER_TEMP/vitasdk"
          export PATH="$VITASDK/bin:$PATH"
          ./bootstrap-vitasdk.sh
          if [ ! -x "$VITASDK/bin/pacman" ] && [ -x "$VITASDK/libexec/vdpm/pacman" ]; then
            ln -s "$VITASDK/libexec/vdpm/pacman" "$VITASDK/bin/pacman"
          fi
          test -x "$VITASDK/bin/pacman"
          export VDPM_NONINTERACTIVE=1
          # The current channel manifest points at an incomplete package snapshot.
          # Pin the last published complete 2026.08 snapshot (139 release assets).
          stable_snapshot="packages-2026.08-snapshot-20261024.61.1"
          current_server="$(grep -E '^Server = https://github.com/vitasdk/vitasdk-autobuild/releases/download/' "$VITASDK/etc/pacman.conf" | tail -n1)"
          test -n "$current_server" || { echo "Vita package repository URL was not found"; exit 1; }
          sed -i "s#https://github.com/vitasdk/vitasdk-autobuild/releases/download/[^[:space:]]*#https://github.com/vitasdk/vitasdk-autobuild/releases/download/$stable_snapshot#" "$VITASDK/etc/pacman.conf"
          echo "Pinned Vita package repository:"
          grep -A1 '^\[vita\]' "$VITASDK/etc/pacman.conf"
          export VDPM_NONINTERACTIVE=1
          "$VITASDK/bin/pacman" --config "$VITASDK/etc/pacman.conf" --root "$VITASDK" --dbpath "$VITASDK/var/lib/pacman" --cachedir "$VITASDK/var/cache/pacman/pkg" --logfile "$VITASDK/var/log/pacman.log" --sync --refresh --noconfirm
          # GitHub's package DB asset is 18,185 bytes with this published SHA-256.
          # Pacman's CDN download above returned a different 6,964-byte DB; fetch the
          # exact immutable asset directly and verify it before using it.
          stable_repo="https://github.com/vitasdk/vitasdk-autobuild/releases/download/$stable_snapshot"
          direct_db="$RUNNER_TEMP/vita.db"
          curl --fail --location --retry 3 --silent --show-error "$stable_repo/vita.db" --output "$direct_db"
          actual_db_size="$(stat -c%s "$direct_db")"
          actual_db_sha="$(sha256sum "$direct_db" | awk '{print $1}')"
          echo "Direct Vita DB size=$actual_db_size sha256=$actual_db_sha"
          test "$actual_db_size" = "18185"
          test "$actual_db_sha" = "fdc3383892de595ccc2ca55bf93ce54df84af1fa8f3f25c12595ad11d65c0202"
          install -m 0644 "$direct_db" "$VITASDK/var/lib/pacman/sync/vita.db"
          # Make vdpm use the exact same config and database paths as the explicit pacman refresh.
          export VDPM_PACMAN_CONF="$VITASDK/etc/pacman.conf"
          echo "===== pacman configuration ====="
          cat "$VDPM_PACMAN_CONF"
          echo "===== downloaded repository databases ====="
          find "$VITASDK/var/lib/pacman/sync" -maxdepth 1 -type f -printf '%f %s bytes\\n' 2>/dev/null || true
          for db in "$VITASDK"/var/lib/pacman/sync/*.db; do
            [ -f "$db" ] || continue
            echo "===== database file: $db ====="
            file "$db"
            tar -tf "$db" 2>&1 | head -n 35 || true
          done
          echo "===== repository package inventory (required names) ====="
          "$VITASDK/bin/pacman" --config "$VDPM_PACMAN_CONF" --root "$VITASDK" --dbpath "$VITASDK/var/lib/pacman" --cachedir "$VITASDK/var/cache/pacman/pkg" --logfile "$VITASDK/var/log/pacman.log" --sync --list || true
          echo "===== targeted package metadata ====="
          "$VITASDK/bin/pacman" --config "$VDPM_PACMAN_CONF" --root "$VITASDK" --dbpath "$VITASDK/var/lib/pacman" --cachedir "$VITASDK/var/cache/pacman/pkg" --logfile "$VITASDK/var/log/pacman.log" --sync --info vitaGL || true
          echo "===== verify required packages ====="
          for package in vitaGL vitaShaRK SceShaccCgExt libmathneon freetype libpng openal-soft libvorbis taihen; do
            ./vdpm info "$package"
          done
          echo "===== install native build dependencies ====="
          ./vdpm install vitaGL vitaShaRK SceShaccCgExt libmathneon freetype libpng openal-soft libvorbis taihen bzip2
          echo "===== installed package verification ====="
          ./vdpm list
          # Export the SDK location and compiler tools to subsequent workflow steps.
          echo "VITASDK=$VITASDK" >> "$GITHUB_ENV"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Download private game input from temporary Release
        env:
          STS_BUILD_TOKEN: ${{ secrets.STS_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STS_BUILD_TOKEN" || { echo "STS_BUILD_TOKEN secret is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sts-input"
          release_status="$(curl --silent --show-error -o "$RUNNER_TEMP/sts-input/release.json" -w '%{http_code}' -H "Authorization: Bearer $STS_BUILD_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/teststs1111/stspsvita-build-private/releases/tags/temp-build-1)"
          if [ "$release_status" != "200" ]; then
            echo "Private Release API returned HTTP $release_status"
            jq -r '.message // "No API error message returned"' "$RUNNER_TEMP/sts-input/release.json"
            exit 1
          fi
          asset_id="$(jq -r '.assets[] | select(.name=="desktop-1.0.jar") | .id' "$RUNNER_TEMP/sts-input/release.json" | head -n1)"
          test -n "$asset_id" && test "$asset_id" != "null" || { echo "desktop-1.0.jar was not found in temp-build-1"; jq -r '.assets[]?.name' "$RUNNER_TEMP/sts-input/release.json"; exit 1; }
          asset_status="$(curl --location --silent --show-error -o "$RUNNER_TEMP/sts-input/desktop-1.0.jar" -w '%{http_code}' -H "Authorization: Bearer $STS_BUILD_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/repos/teststs1111/stspsvita-build-private/releases/assets/$asset_id")"
          if [ "$asset_status" != "200" ]; then
            echo "Private Release asset API returned HTTP $asset_status"
            jq -r '.message // "No API error message returned"' "$RUNNER_TEMP/sts-input/desktop-1.0.jar" 2>/dev/null || true
            exit 1
          fi
          test -s "$RUNNER_TEMP/sts-input/desktop-1.0.jar"
          sha256sum "$RUNNER_TEMP/sts-input/desktop-1.0.jar"
          jar tf "$RUNNER_TEMP/sts-input/desktop-1.0.jar" > "$RUNNER_TEMP/sts-input/jar-entries.txt"
          test -s "$RUNNER_TEMP/sts-input/jar-entries.txt"
          echo "JAR archive listing (first 20 entries):"
          sed -n '1,20p' "$RUNNER_TEMP/sts-input/jar-entries.txt"

      - name: Build VPK packages
        run: |
          set -euo pipefail
          ./build.sh --sts-jar "$RUNNER_TEMP/sts-input/desktop-1.0.jar" --langs eng,jpn --audio-kbps 0
          test -s build/STSVITA.vpk
          test -s build/STSVITA-slim.vpk
          test -s build/native/STSVITA.map
          cp build/native/STSVITA.map build/STSVITA.map
          ls -lh build/STSVITA.vpk build/STSVITA-slim.vpk build/STSVITA.map

      - name: Resolve native allocator caller address
        run: |
          set -euo pipefail
          test -s build/native/STSVITA
          {
            echo "Runtime caller address: 0x8158dda3"
            arm-vita-eabi-addr2line -f -C -e build/native/STSVITA 0x8158dda3 || true
            echo
            echo "Nearest native symbols:"
            arm-vita-eabi-nm -n -C build/native/STSVITA | awk '$1 ~ /^[0-9a-fA-F]+$/ { print }' > build/native/STSVITA.symbols.txt
            grep -B 8 -A 8 -i '8158dda3' build/native/STSVITA.symbols.txt || true
          } > build/native/STSVITA.address-report.txt
          cat build/native/STSVITA.address-report.txt

      - name: Disassemble native allocator callsite
        run: |
          set -euo pipefail
          arm-vita-eabi-objdump -d -C --line-numbers --start-address=0x8158dd70 --stop-address=0x8158de80 build/native/STSVITA > build/native/STSVITA.cff-callsite.txt
          arm-vita-eabi-objdump -d -C --line-numbers --start-address=0x81500520 --stop-address=0x8150070c build/native/STSVITA > build/native/STSVITA.reserve-wrapper.txt
          arm-vita-eabi-objdump -d -C --line-numbers --start-address=0x8150ff70 --stop-address=0x81510180 build/native/STSVITA > build/native/STSVITA.draw-caller.txt
          arm-vita-eabi-objdump -d -C build/native/STSVITA | grep -E -B 8 -A 8 '(^|[[:space:]])(malloc|calloc|realloc|FT_Memory_Alloc|ft_mem_alloc|ft_mem_qalloc|ft_mem_realloc)' > build/native/STSVITA.alloc-callers.txt || true
          cat build/native/STSVITA.cff-callsite.txt
          cat build/native/STSVITA.reserve-wrapper.txt

      - name: Upload native callsite disassembly
        uses: actions/upload-artifact@v4
        with:
          name: native-callsite-disassembly
          path: |
            build/native/STSVITA.cff-callsite.txt
            build/native/STSVITA.alloc-callers.txt
            build/native/STSVITA.reserve-wrapper.txt
            build/native/STSVITA.draw-caller.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload native address symbol report
        uses: actions/upload-artifact@v4
        with:
          name: native-address-symbol-report
          path: |
            build/native/STSVITA.address-report.txt
            build/native/STSVITA.symbols.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload native linker map for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: native-linker-map
          path: build/STSVITA.map
          if-no-files-found: error
          retention-days: 1

      - name: Verify Japanese font payload and build manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          manifest = json.loads(Path("build/build-manifest.json").read_text())
          languages = manifest["options"]["languages"]
          assert languages == ["eng", "jpn"], f"unexpected languages: {languages}"
          fonts = manifest["assets"]["requested_cjk_fonts"]["jpn"]
          assert fonts["files"] > 0 and fonts["bytes"] > 0, fonts
          with zipfile.ZipFile("build/STSVITA.vpk") as vpk:
              entries = [
                  info for info in vpk.infolist()
                  if info.filename.startswith("assets/font/jpn/") and not info.is_dir()
              ]
              assert len(entries) == fonts["files"], (len(entries), fonts)
              assert sum(info.file_size for info in entries) == fonts["bytes"], fonts
          print(
              f"manifest languages={languages}; "
              f"font/jpn packaged={len(entries)} files/{fonts['bytes']} bytes; "
              f"full_assets_match_staging={manifest['validation']['full_assets_match_staging']}"
          )
          PY

      - name: Upload full VPK and build manifest to private release
        env:
          STS_BUILD_TOKEN: ${{ secrets.STS_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STS_BUILD_TOKEN" || { echo "STS_BUILD_TOKEN secret is missing"; exit 1; }
          api="https://api.github.com/repos/teststs1111/stspsvita-build-private"
          release_json="$RUNNER_TEMP/private-release.json"
          release_status="$(curl --silent --show-error -o "$release_json" -w '%{http_code}' \
            -H "Authorization: Bearer $STS_BUILD_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/releases/tags/temp-build-1")"
          if [ "$release_status" != "200" ]; then
            echo "Private Release API returned HTTP $release_status"
            jq -r '.message // "No API error message returned"' "$release_json"
            exit 1
          fi
          upload_url="$(jq -r '.upload_url' "$release_json" | sed 's/{?name,label}//')"
          for asset in STSVITA.vpk build-manifest.json STSVITA.map; do
            asset_id="$(jq -r --arg name "$asset" '.assets[]? | select(.name==$name) | .id' "$release_json" | head -n1)"
            if [ -n "$asset_id" ] && [ "$asset_id" != "null" ]; then
              curl --fail --silent --show-error -X DELETE \
                -H "Authorization: Bearer $STS_BUILD_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$api/releases/assets/$asset_id"
            fi
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $STS_BUILD_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"build/$asset" \
              "$upload_url?name=$asset" > "$RUNNER_TEMP/upload-$asset.json"
            echo "Uploaded private asset $asset ($(stat -c%s "build/$asset") bytes)"
          done

      - name: Remove game input and generated game-derived files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/sts-input"
          rm -rf work/assets_raw work/assets_vita work/gen work/generated_c work/jar_path.txt
          rm -rf work/assets-vita-metadata.json work/sce_sys build transpiler/build transpiler/.gradle
