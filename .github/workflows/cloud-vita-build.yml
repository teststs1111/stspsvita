name: Remove temporary game-derived release outputs

on:
  push:
    branches:
      - optimization/baseline-profiling

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete private VPK and generated build outputs
        env:
          STS_BUILD_TOKEN: ${{ secrets.STS_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STS_BUILD_TOKEN" || { echo "STS_BUILD_TOKEN secret is missing"; exit 1; }
          api="https://api.github.com/repos/teststs1111/stspsvita-build-private"
          release_json="$RUNNER_TEMP/private-release.json"
          status="$(curl --silent --show-error -o "$release_json" -w '%{http_code}' \
            -H "Authorization: Bearer $STS_BUILD_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api/releases/tags/temp-build-1")"
          if [ "$status" = "404" ]; then
            echo "Temporary private release does not exist; nothing to remove."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "Private Release lookup failed with HTTP $status"
            jq -r '.message // "No API error message returned"' "$release_json"
            exit 1
          fi
          jq -r '.assets[]
            | select(.name == "STSVITA.vpk"
                  or .name == "STSVITA-slim.vpk"
                  or .name == "STSVITA.map"
                  or .name == "build-manifest.json")
            | [.id, .name] | @tsv' "$release_json" |
          while IFS="$(printf '\t')" read -r asset_id asset_name; do
            test -n "$asset_id"
            echo "Deleting private generated output: $asset_name (asset $asset_id)"
            delete_status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $STS_BUILD_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api/releases/assets/$asset_id")"
            if [ "$delete_status" != "204" ]; then
              echo "Delete failed for $asset_name with HTTP $delete_status"
              exit 1
            fi
          done
          echo "Private VPK, map, and manifest cleanup complete."
